name: Build Overtonight Client
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.4.0
      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
      - name: Install Overtonight album artwork and icon
        shell: bash
        run: |
          base64 -d src/main/resources/assets/icon.png.b64 > src/main/resources/assets/icon.png
          rm src/main/resources/assets/icon.png.b64
          mkdir -p src/main/resources/assets/autospearswap/textures/gui
          python3 - <<'PY'
          import json
          import urllib.request
          import urllib.error

          output = "src/main/resources/assets/autospearswap/textures/gui/overtonight-cover.jpg"

          def fetch(url):
              req = urllib.request.Request(url, headers={
                  "User-Agent": "OvertonightClient/2.0 (desktop mod artwork)",
                  "Accept": "image/avif,image/webp,image/apng,image/svg+xml,image/*,*/*;q=0.8"
              })
              with urllib.request.urlopen(req, timeout=25) as response:
                  data = response.read()
                  content_type = response.headers.get("Content-Type", "")
              if not data or not (data.startswith(b"\xff\xd8\xff") or data.startswith(b"\x89PNG")):
                  raise RuntimeError("unexpected image response " + content_type + " (" + str(len(data)) + " bytes)")
              with open(output, "wb") as image:
                  image.write(data)
              print("Album artwork saved from " + url)

          sources = [
              ("Spotify oEmbed", "https://open.spotify.com/oembed?url=https%3A%2F%2Fopen.spotify.com%2Falbum%2F2wVlRXuhfGaHp4vBskI9MG"),
              ("Cover Art Archive", "https://coverartarchive.org/release/1f7e996e-306c-4774-a2e5-764576c071cf/front-500"),
              ("Cover Art Archive image", "https://coverartarchive.org/release/1f7e996e-306c-4774-a2e5-764576c071cf/42198615276-500.jpg"),
          ]

          installed = False
          for label, url in sources:
              try:
                  if label == "Spotify oEmbed":
                      request = urllib.request.Request(url, headers={"User-Agent": "OvertonightClient/2.0"})
                      with urllib.request.urlopen(request, timeout=20) as response:
                          metadata = json.loads(response.read().decode("utf-8"))
                      fetch(metadata["thumbnail_url"])
                  else:
                      fetch(url)
                  installed = True
                  break
              except Exception as error:
                  print(label + " failed: " + repr(error))

          if not installed:
              try:
                  lookup = "https://itunes.apple.com/lookup?id=1812734454&entity=album"
                  request = urllib.request.Request(lookup, headers={"User-Agent": "OvertonightClient/2.0"})
                  with urllib.request.urlopen(request, timeout=20) as response:
                      metadata = json.loads(response.read().decode("utf-8"))
                  albums = [item for item in metadata.get("results", []) if item.get("wrapperType") == "collection"]
                  if not albums:
                      raise RuntimeError("Apple catalog returned no album")
                  artwork_url = albums[0]["artworkUrl100"].replace("100x100bb", "1200x1200bb")
                  fetch(artwork_url)
                  installed = True
              except Exception as error:
                  print("Apple catalog failed: " + repr(error))

          if not installed:
              print("WARNING: official cover artwork could not be reached; generating branded fallback art.")
          PY
          if [ -s src/main/resources/assets/autospearswap/textures/gui/overtonight-cover.jpg ]; then
            convert src/main/resources/assets/autospearswap/textures/gui/overtonight-cover.jpg -resize 128x128^ -gravity center -extent 128x128 src/main/resources/assets/icon.png
          else
            convert -size 640x640 gradient:'#250d16-#050406' -gravity center -fill '#f0e8e8' -font DejaVu-Sans-Bold -pointsize 58 -annotate +0-24 'OVERTONIGHT' -fill '#bd263a' -pointsize 24 -annotate +0+42 'DROP OUT / AFTER HOURS' src/main/resources/assets/autospearswap/textures/gui/overtonight-cover.jpg
            convert src/main/resources/assets/autospearswap/textures/gui/overtonight-cover.jpg -resize 128x128^ -gravity center -extent 128x128 src/main/resources/assets/icon.png
          fi
      - name: Build
        run: gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: Overtonight-Client
          path: build/libs/*.jar
