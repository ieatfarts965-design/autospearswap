name: Build AutoSpearSwap
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.4.0
      - name: Install Nexus icon
        run: base64 -d src/main/resources/assets/icon.png.b64 > src/main/resources/assets/icon.png && rm src/main/resources/assets/icon.png.b64
      - name: Build
        run: gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: AutoSpearSwap
          path: build/libs/*.jar
